name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: >-
          xcodebuild
          -project CodexBar.xcodeproj
          -scheme CodexBar
          -configuration Debug
          CODE_SIGNING_ALLOWED=NO
          test
