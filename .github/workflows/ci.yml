name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: >-
          xcodebuild
          -project CodexBar.xcodeproj
          -scheme CodexBar
          -configuration Debug
          CODE_SIGNING_ALLOWED=NO
          test
